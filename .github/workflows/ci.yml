name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      previous_manifest_ref:
        description: Exact ancestor commit containing the previous public git-slop manifest
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: scoop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Windows ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: 64bit
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - architecture: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout bucket
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned Scoop core
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ScoopInstaller/Scoop
          ref: b588a06e41d920d2123ec70aee682bae14935939
          path: .scoop-core
          persist-credentials: false

      - name: Validate trusted automation contract
        shell: pwsh
        run: ./scripts/Test-AutomationContract.ps1

      - name: Select publishable manifest or immutable fixture
        id: manifest
        shell: pwsh
        run: |
          $path = if (Test-Path -LiteralPath 'bucket/git-slop.json') {
            'bucket/git-slop.json'
          } else {
            'tests/fixtures/git-slop.json'
          }
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate Scoop schema and release identity
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath '${{ steps.manifest.outputs.path }}' -Raw
          $schema = (Resolve-Path -LiteralPath '.scoop-core/schema.json').Path
          if (-not ($manifest | Test-Json -SchemaFile $schema -ErrorAction Stop)) {
            throw 'Manifest failed the pinned Scoop JSON schema.'
          }
          ./scripts/Test-GitSlopManifest.ps1 `
            -ManifestPath '${{ steps.manifest.outputs.path }}' `
            -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'git-slop-release-evidence')

      - name: Prove native install, uninstall, and hash failure
        shell: pwsh
        run: |
          ./scripts/Test-GitSlopInstall.ps1 `
            -ManifestPath '${{ steps.manifest.outputs.path }}' `
            -Architecture '${{ matrix.architecture }}' `
            -ExpectedTarget '${{ matrix.target }}' `
            -ScoopHome '.scoop-core' `
            -ReleaseManifestPath (Join-Path $env:RUNNER_TEMP 'git-slop-release-evidence/release-manifest.json')

      - name: Resolve exact previous public manifest
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.previous_manifest_ref != '' }}
        id: previous_manifest
        shell: pwsh
        env:
          PREVIOUS_MANIFEST_REF: ${{ inputs.previous_manifest_ref }}
        run: |
          if ($env:PREVIOUS_MANIFEST_REF -cnotmatch '^[a-f0-9]{40}$') {
            throw 'previous_manifest_ref must be one full lowercase commit SHA.'
          }
          & git merge-base --is-ancestor $env:PREVIOUS_MANIFEST_REF HEAD
          if ($LASTEXITCODE -ne 0) {
            throw 'previous_manifest_ref must be an ancestor of the dispatched revision.'
          }
          $previousManifest = @(
            & git show "${env:PREVIOUS_MANIFEST_REF}:bucket/git-slop.json"
          )
          if ($LASTEXITCODE -ne 0 -or $previousManifest.Count -eq 0) {
            throw 'The exact previous commit does not contain bucket/git-slop.json.'
          }
          $path = Join-Path $env:RUNNER_TEMP 'git-slop-previous-manifest.json'
          [System.IO.File]::WriteAllLines(
            $path,
            $previousManifest,
            [System.Text.UTF8Encoding]::new($false)
          )
          $previous = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          $current = Get-Content -LiteralPath '${{ steps.manifest.outputs.path }}' -Raw | ConvertFrom-Json
          if ([version] $previous.version -ge [version] $current.version) {
            throw "Previous version $($previous.version) must precede current version $($current.version)."
          }
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prove cross-version upgrade in place
        if: ${{ steps.previous_manifest.outputs.path != '' }}
        shell: pwsh
        run: |
          ./scripts/Test-GitSlopUpgrade.ps1 `
            -PreviousManifestPath '${{ steps.previous_manifest.outputs.path }}' `
            -CurrentManifestPath '${{ steps.manifest.outputs.path }}' `
            -Architecture '${{ matrix.architecture }}' `
            -ExpectedTarget '${{ matrix.target }}' `
            -ScoopHome '.scoop-core' `
            -CurrentReleaseManifestPath (Join-Path $env:RUNNER_TEMP 'git-slop-release-evidence/release-manifest.json')

      - name: Summarize qualification
        if: always()
        shell: pwsh
        run: |
          @"
          ### Git Slop Scoop qualification

          - Manifest: ${{ steps.manifest.outputs.path }}
          - Architecture: ${{ matrix.architecture }}
          - Target: ${{ matrix.target }}
          - Scoop core: b588a06e41d920d2123ec70aee682bae14935939
          - Previous manifest ref: ${{ inputs.previous_manifest_ref || 'not requested' }}
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
