name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scoop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Windows ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: 64bit
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - architecture: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout bucket
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout pinned Scoop core
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ScoopInstaller/Scoop
          ref: b588a06e41d920d2123ec70aee682bae14935939
          path: .scoop-core
          persist-credentials: false

      - name: Select publishable manifest or immutable fixture
        id: manifest
        shell: pwsh
        run: |
          $path = if (Test-Path -LiteralPath 'bucket/git-slop.json') {
            'bucket/git-slop.json'
          } else {
            'tests/fixtures/git-slop.json'
          }
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate Scoop schema and release identity
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath '${{ steps.manifest.outputs.path }}' -Raw
          $schema = (Resolve-Path -LiteralPath '.scoop-core/schema.json').Path
          if (-not ($manifest | Test-Json -SchemaFile $schema -ErrorAction Stop)) {
            throw 'Manifest failed the pinned Scoop JSON schema.'
          }
          ./scripts/Test-GitSlopManifest.ps1 `
            -ManifestPath '${{ steps.manifest.outputs.path }}' `
            -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'git-slop-release-evidence')

      - name: Prove native install, uninstall, and hash failure
        shell: pwsh
        run: |
          ./scripts/Test-GitSlopInstall.ps1 `
            -ManifestPath '${{ steps.manifest.outputs.path }}' `
            -Architecture '${{ matrix.architecture }}' `
            -ExpectedTarget '${{ matrix.target }}' `
            -ScoopHome '.scoop-core' `
            -ReleaseManifestPath (Join-Path $env:RUNNER_TEMP 'git-slop-release-evidence/release-manifest.json')

      - name: Summarize qualification
        if: always()
        shell: pwsh
        run: |
          @"
          ### Git Slop Scoop qualification

          - Manifest: ${{ steps.manifest.outputs.path }}
          - Architecture: ${{ matrix.architecture }}
          - Target: ${{ matrix.target }}
          - Scoop core: b588a06e41d920d2123ec70aee682bae14935939
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
